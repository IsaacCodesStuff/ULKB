[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulkb"
version = "0.1.0"
description = "Declarative Linux kernel build system for REM/ICS scheduler research"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "requests>=2.28",
    "rich>=13.0",
    "click>=8.0",
]

[project.scripts]
kbuild = "builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
