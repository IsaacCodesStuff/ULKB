# Validates build definitions without doing a full kernel build.
# Fast — runs in under a minute. Good for every push/PR.

name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate build definitions
        run: python -m builder validate builds/

      - name: Validate toolchain descriptors
        run: python -m builder validate --kind toolchain toolchains/

      - name: Validate config fragments
        run: python -m builder validate-configs configs/

      - name: Unit tests
        run: python -m pytest -q
