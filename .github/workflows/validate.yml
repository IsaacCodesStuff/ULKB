# .github/workflows/validate.yml
# Validates build definitions without doing a full kernel build.
# Fast — runs in < 1 minute. Good for every push/PR.

name: Validate Build Definitions

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML schemas
        run: python -m builder validate builds/

      - name: Validate toolchain descriptors
        run: python -m builder validate toolchains/

      - name: Validate config fragments
        run: python -m builder validate-configs configs/