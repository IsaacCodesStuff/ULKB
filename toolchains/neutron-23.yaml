name: "Neutron Clang"
version: "23.0.1"
# URL to be filled when pinning a specific release
url: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/23.0.1/..."
checksum:
  algorithm: sha256
  value: "" # fill when URL is confirmed

env:
  CC: clang
  LD: ld.lld
  AR: llvm-ar
  NM: llvm-nm
  OBJCOPY: llvm-objcopy
  OBJDUMP: llvm-objdump
  READELF: llvm-readelf
  STRIP: llvm-strip
  HOSTCC: clang
  HOSTCXX: clang++
