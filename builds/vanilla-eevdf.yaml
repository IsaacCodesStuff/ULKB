# Baseline build — stock EEVDF, no patches, no scheduler modifications.
# This is the reference point for all REM/ICS benchmark comparisons.

meta:
  name: vanilla-eevdf
  description: "Stock upstream EEVDF — benchmark baseline"

kernel:
  source:
    type: git
    repo: https://github.com/torvalds/linux
    # "branch" also accepts a tag. A tag keeps the baseline from moving.
    branch: v7.2            # release tag, so every comparison build uses the same source
    depth: 1   # shallow clone: only the newest commit, not the full history

target:
  arch: x86_64
  cross_compile: null

toolchain:
  descriptor: toolchains/kernel-org-llvm-23.yaml

config:
  base: defconfig
  mode: release
  fragments:
    - configs/common/perf.config

patches: []

build:
  jobs: auto
  ccache: true
  flags:
    - LLVM=1
    - LLVM_IAS=1

output:
  directory: dist/vanilla-eevdf
  artifacts:
    - arch/x86/boot/bzImage
    - System.map
  metadata: true
